<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Microsite de Evento Tecnológico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* Imagem de destaque do evento */
        .bg-header {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 20px;
        }

        /* Caixa de apresentação do evento */
        .header-title {
            background-color: #f8f9faa4;
            border: 1px solid #f8f9faa4;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Espaçamento antes do menu de navegação -->
    <div class="my-4"></div>

    <header>
        <!-- Menu de navegação principal do microsite -->
        <div class="container">
            <ul class="nav" aria-label="Menu principal">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="index.html">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="programa.html">Programa</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="oradores.html">Oradores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contacto.html">Inscrição/Contacto</a>
                </li>
            </ul>
        </div>
    </header>

    <!-- Separação -->
    <hr>

    <main>
        <!-- Apresentação e imagem de destaque do evento -->
        <div class="container">

            <!-- Caixa com o título, a descrição e a imagem do evento -->
            <div class="header-title">
                <h1>Web Summit 2026</h1>
                <h2>Introdução</h2>

                <!-- Separação -->
                <hr>

                <div class="alert theme-secondary" role="alert">
                    <p>Líderes tecnológicos, investidores e empreendedores reúnem-se na Web Summit para moldar o
                        futuro do setor.</p>
                </div>

                <!-- Separação entre a descrição e a imagem -->
                <hr>

                <!-- Imagem principal do evento com cantos arredondados -->
                <img src="images/header-web-summit.jpg" alt="Imagem de destaque da Web Summit" class="bg-header">

            </div>
        </div>
    </main>

</body>

</html>
